# Netlify deployment: static Vite build with the test suite as a deploy gate.

[build]
  command = "npm test && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Vite emits content-hashed filenames under /assets — safe to cache forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # The two sha256 hashes cover the inline theme-bootstrap <script> in each
    # concept page (pages/*.html <head>). If those scripts ever change,
    # recompute: base64(sha256(exact text between the script tags)).
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-QvIzHiENLCbYZvHm4iSNg3Q0lMdZaJFnGuPUYKbY55g=' 'sha256-hxGJtMM/DW5E8aQ9CR5oVANes5l1mCJcTKivPBKIjUc='; style-src 'self'; font-src 'self'; img-src 'self' data: https://images.unsplash.com; frame-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'"
